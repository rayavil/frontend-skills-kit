librerias_alternativas:
  # Candidatas con buena valoración de comunidad pero que no son Tailwind-first.
  # Usar cuando el proyecto no dependa de Tailwind o cuando Tailwind no resuelva bien el caso.
  - id: shoelace
    nombre: "Shoelace (Web Awesome)"
    tipo: libreria
    framework: ["agnostico (web components)"]
    licencia: MIT
    licencia_gratis: true
    repo: https://github.com/shoelace-style/shoelace
    demo: https://shoelace.style/
    instalacion: "npm install @shoelace-style/shoelace"
    estado: activa
    top_pick: false
    nota: "Web Components nativos — funcionan igual en Vue y React sin atarte a ningún framework. Útil si un proyecto necesita componentes compartidos entre stacks distintos."

  - id: mantine
    nombre: "Mantine"
    tipo: libreria
    framework: [react]
    licencia: MIT
    licencia_gratis: true
    repo: https://github.com/mantinedev/mantine
    demo: https://mantine.dev/
    instalacion: "npm install @mantine/core"
    estado: activa
    top_pick: false
    nota: "Bien valorada por devs (4.4/5 en reseñas agregadas) — madura y estable. No es Tailwind-first (usa CSS Modules), considerar solo si Tailwind no encaja con el proyecto."

  - id: chakra-ui
    nombre: "Chakra UI"
    tipo: libreria
    framework: [react]
    licencia: MIT
    licencia_gratis: true
    repo: https://github.com/chakra-ui/chakra-ui
    demo: https://www.chakra-ui.com/
    instalacion: "npm install @chakra-ui/react"
    estado: activa
    top_pick: false
    nota: "Buena flexibilidad sin abrumar con demasiados componentes. Mismo caso que Mantine: no es Tailwind-first."

