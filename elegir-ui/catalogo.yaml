# Catálogo de sistemas de UI y plantillas open source
# Para: Ray Ávila / Devizac — stack principal: Laravel + Inertia.js + Vue 3 / React + Tailwind
# Última actualización: 2026-10-16
# Fuentes: investigación propia + validación comunitaria (Reddit agregado, rankings especializados, GitHub stats)
#
# Campos:
#   tipo: "plantilla" (páginas armadas con layout, nav y datos de ejemplo) | "libreria" (componentes sueltos a ensamblar)
#   licencia_gratis: true si el uso que necesitas (no comercial-Pro) es 100% gratis
#   estado: "activa" | "mantenimiento_moderado" | "legacy" (evitar)
#   top_pick: true = primera opción recomendada en su categoría para el stack de Ray
#   instalacion: cómo se obtiene (npm/composer/copy-paste/git clone)

starter_kit:
  - id: laravel-breeze
    nombre: "Laravel Breeze (Inertia)"
    tipo: plantilla
    framework: [vue3, react]
    licencia: MIT
    licencia_gratis: true
    repo: https://github.com/laravel/breeze
    demo: null
    instalacion: "composer require laravel/breeze --dev && php artisan breeze:install"
    estado: activa
    top_pick: false
    nota: "Oficial de Laravel. Considerar laravel/vue-starter-kit como reemplazo moderno (ver abajo)."

  - id: laravel-vue-starter-kit
    nombre: "Laravel Vue Starter Kit (oficial, Inertia v2)"
    tipo: plantilla
    framework: [vue3]
    licencia: MIT
    licencia_gratis: true
    repo: https://github.com/laravel/vue-starter-kit
    demo: null
    instalacion: "laravel new --vue"
    estado: activa
    top_pick: true
    nota: "Reemplazo moderno de Breeze. Punto de partida por defecto para nuevos proyectos Inertia+Vue."

  - id: pingcrm
    nombre: "Ping CRM (demo oficial de Inertia.js)"
    tipo: plantilla
    framework: [vue3]
    licencia: MIT
    licencia_gratis: true
    repo: https://github.com/inertiajs/pingcrm
    demo: https://demo.inertiajs.com/login
    instalacion: "git clone"
    estado: activa
    top_pick: true
    nota: "Mejor referencia real de cómo estructurar un CRM/admin completo en Laravel+Inertia. Útil como esqueleto, no solo como UI."

  - id: shadcn-ui
    nombre: "shadcn/ui / shadcn-vue"
    tipo: libreria
    framework: [react, vue3]
    licencia: MIT
    licencia_gratis: true
    repo: "https://github.com/shadcn-ui/ui | https://github.com/unovue/shadcn-vue"
    demo: "https://ui.shadcn.com/examples/dashboard | https://www.shadcn-vue.com/examples/dashboard.html"
    instalacion: "npx shadcn@latest init"
    estado: activa
    top_pick: true
    nota: "#1 mejor valorada por la comunidad dev (4.6-4.8/5 en reseñas agregadas). Control total del código, se copia a tu repo."

  - id: sakai
    nombre: "Sakai Vue / React (PrimeTek)"
    tipo: plantilla
    framework: [vue3, react]
    licencia: MIT
    licencia_gratis: true
    repo: "https://github.com/primefaces/sakai-vue | https://github.com/primefaces/sakai-react"
    demo: "https://sakai.primevue.org/ | https://sakai.primereact.org/"
    instalacion: "git clone"
    estado: activa
    top_pick: false
    nota: "Dashboard completo con menú, gráficas y páginas. Integrable en resources/js de Inertia."

  - id: admin-one-vue-tailwind
    nombre: "Admin One Vue Tailwind"
    tipo: plantilla
    framework: [vue3]
    licencia: MIT
    licencia_gratis: true
    repo: https://github.com/justboil/admin-one-vue-tailwind
    demo: https://justboil.github.io/admin-one-vue-tailwind/
    instalacion: "git clone"
    estado: activa
    top_pick: false
    nota: "Guía oficial para integrarse sobre Breeze + Inertia."

  - id: flowbite
    nombre: "Flowbite (React / Vue)"
    tipo: libreria
    framework: [react, vue3]
    licencia: "MIT (core) / Pro freemium"
    licencia_gratis: true
    repo: "https://github.com/themesberg/flowbite-react | https://github.com/themesberg/flowbite-vue"
    demo: https://flowbite.com/application-ui/demo/
    instalacion: "npm install flowbite-vue / flowbite-react"
    estado: activa
    top_pick: false
    nota: "Solo usar el core gratis; los bloques 'Pro' no cuentan como libres."

