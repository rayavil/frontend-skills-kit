# Mapeo: tipo de proyecto -> qué categorías/componentes necesita típicamente
# La skill usa esto para traducir "quiero hacer un app X" a categorías del catálogo
mapeo_proyecto_componentes:
  app_deportiva: [dashboard, admin_panel]
  # cards de stats, gráficas, calendario de partidos, tablas de posiciones, perfiles de jugador
  saas_b2b: [starter_kit, dashboard, admin_panel]
  crm: [starter_kit, admin_panel]
  tienda_online: [ecommerce, landing_page]
  landing_producto: [landing_page]
  sitio_institucional: [landing_page]
  app_movil_hibrida: [app_movil, starter_kit]
  intranet_erp: [admin_panel]
  blog_contenido: [landing_page]
