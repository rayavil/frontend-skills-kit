# Perfil de marca — Medio Maratón Fresnillo (MMF)
# Valores tomados del sitio oficial mediomaratonfresnillo.com (CSS y textos publicados) y de las
# carpetas de recursos gráficos de Drive. Campos en null = el sitio no los publica; complétalos
# cuando Ray los confirme, en vez de inventarlos.

cliente: "Medio Maratón Fresnillo"
alias: ["MMF", "MMF/2027", "Medio Maratón Fresnillo 2027", "mediomaratonfresnillo.com", "carrera de Fresnillo"]
ultima_verificacion: "2026-10-16"

# Marca oscura y monocromática: no hay un color de acento aparte, el "acento" es el mismo hueso del texto.
paleta:
  fondo: "#0b0b0c"            # bg — fondo de página y theme-color del sitio
  superficie: "#121214"       # tarjetas, campos, cajas de la cuenta regresiva
  linea: "#26262a"            # divisores y bordes de 1px (solo trazos, nunca texto)
  texto: "#eceae6"            # hueso: texto principal, titulares, acento y emblema
  texto_suave: "#cfcdc8"      # antetítulo «MEDIO MARATÓN»
  texto_secundario: "#9c9b97" # etiquetas y apoyos (≈7:1 sobre el fondo)
  tenue: "#55555b"            # solo marcas decorativas, ≈2.7:1: NO usar para texto
  acento: "#eceae6"           # = texto; botón principal con fondo hueso y texto #0b0b0c
  confirmacion: "#3ddc84"     # verde, solo confirmaciones; uso mínimo y siempre con texto
  nota: "Sin gradientes ni colores extra. Todo el contraste viene de hueso sobre casi-negro. Para presentaciones: todas las láminas en #0b0b0c."

tipografia:
  titulos: "Saira, cursiva, peso 800, MAYÚSCULAS, ancho expandido (font-stretch 125%), tracking -1.12px"
  antetitulo: "Saira cursiva 800 MAYÚSCULAS, 27px, tracking 3.8px, color #cfcdc8"
  encabezados: "Saira 700, 24px / 38px, sin cursiva"
  cuerpo: "Saira 400, 16px / 26px"
  mono: "JetBrains Mono — cuenta regresiva, números de dorsal y micro-etiquetas"
  fuente: "Ambas en Google Fonts"
  hero: "FRESNILLO a 120px / 108px (display-hero)"

forma:
  radios: "0 — todo con esquinas rectas"
  bordes: "1px #26262a"
  sombras: "ninguna"

tono_visual:
  - "Oscuro, monocromático y de 'operación clasificada': lo no anunciado se muestra como ████ y la etiqueta «Clasificado»; úsalo solo para datos realmente pendientes."
  - "Fotografía de la calle de Fresnillo en blanco y negro, oscurecida; el emblema del minero en blanco sólido encima."
  - "Movimiento con ease-out cubic-bezier(0.23, 1, 0.32, 1) y ease-in-out cubic-bezier(0.77, 0, 0.175, 1); respetar siempre movimiento reducido."
  - "Sin emojis, sin iconos decorativos, sin glassmorphism ni gradientes de color."

voz:
  - "Habla de tú y en imperativo corto: «Suscríbete a las novedades», «Construye tu propio reto», «Baja y empieza a correr»."
  - "Lema: «Construye tu propio reto». Salida: «En sus marcas · Listos · ¡Ya!». Promesa: «Cada metro cuenta»."
  - "Distancia siempre como 21,097.5 m (o «21,097.5 metros»); fecha como «Mayo 2027»; sigla MMF/2027."
  - "No prometer fecha, costo, ruta ni kit hasta que estén publicados."

