  descripcion: "Minero de perfil, mirando a la derecha, con casco y lámpara frontal; una sola tinta, blanco hueso sobre fondo oscuro."
  formato_disponible: "PNG con fondo transparente (MINERO.png). No hay SVG todavía: pedírselo a Ray si la pieza va a pantalla grande o impresión."
  reglas: "Un emblema por lámina como máximo; no recolorear, contornear, girar ni repetir como patrón. Acompañarlo de FRESNILLO (display-hero) con MEDIO MARATÓN encima."

